<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ethosGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2928"/>
      <stop offset="100%" stop-color="#061A19"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M256 36 L432 96 C432 280 344 416 256 476 C168 416 80 280 80 96 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#ethosGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"/>

  <!-- Core Citation Node Network -->
  <g filter="url(#glow)">
    <!-- Central Hexagonal Core -->
    <polygon points="256,160 316,195 316,265 256,300 196,265 196,195" 
             fill="none" 
             stroke="url(#ethosGrad)" 
             stroke-width="10"/>

    <!-- Central Spark -->
    <circle cx="256" cy="230" r="24" fill="#A7F3D0"/>
    <path d="M256 190 L256 270 M216 230 L296 230" stroke="#047857" stroke-width="6" stroke-linecap="round"/>

    <!-- Radiating Verification Nodes -->
    <line x1="256" y1="160" x2="256" y2="105" stroke="#34D399" stroke-width="6" stroke-dasharray="4,4"/>
    <circle cx="256" cy="100" r="14" fill="#34D399"/>

    <line x1="316" y1="265" x2="368" y2="315" stroke="#38BDF8" stroke-width="6" stroke-dasharray="4,4"/>
    <circle cx="372" cy="320" r="14" fill="#38BDF8"/>

    <line x1="196" y1="265" x2="144" y2="315" stroke="#38BDF8" stroke-width="6" stroke-dasharray="4,4"/>
    <circle cx="140" cy="320" r="14" fill="#38BDF8"/>

    <!-- Anchor Baseline -->
    <path d="M190 380 L256 360 L322 380" fill="none" stroke="url(#ethosGrad)" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
